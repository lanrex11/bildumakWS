<h2>Bilatzaile</h2>

<section id="bilaketa" class="panel">
  <h3>Bilaketa</h3>
  <form id="form-bilatzaile">
    <input type="text" id="input-bilaketa" autocomplete="off" placeholder="Bilatzen...">
    <button type="submit">Bilatu</button>
  </form>
  <p id="egoera-bilatzen"></p>
</section>

<div class="bilatzaile-edukia">

  <section id="emaitzak" class="panel">
    <h3>Emaitzak</h3>
    <div id="emaitzak-bilaketa">
      <p>Bilaketa bat gauzatu emaitzak lortzeko</p>
    </div>
  </section>

  <div id="panel-hautatua" class="panel">
    <h3>Onddo hautatua</h3>
    <div id="xehetasunak-item">
      <p>Emaitzetako bat aukeratu, bere xehetasunak bistaratzeko.</p>
    </div>
  </div>

</div>
